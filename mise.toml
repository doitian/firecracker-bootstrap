[tasks.extract-kernelfs]
description = "Extract kernel filesystem layers from OCI image"
run = "bin/extract-kernelfs.sh"

[tasks.bake-rootfs]
description = "Bake a Firecracker rootfs ext4 image"
usage = '''
arg "<kernelfs-dir>" help="Path to kernelfs directory (e.g. kernelfs/6.18-fc-amd64)"
arg "<image-tag>" help="Docker image tag (e.g. bare-bones)"
'''
run = "bin/bake-rootfs.sh {{ usage.kernelfs_dir }} {{ usage.image_tag }}"

[tasks.cleanup]
description = "Remove baked rootfs ext4 images"
run = "rm -rf rootfs/*/*.ext4 kernelfs/*"
