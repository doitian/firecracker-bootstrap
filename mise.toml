[tools]
"github:F1bonacc1/process-compose" = "latest"

[tasks.extract-kernelfs]
description = "Extract kernel filesystem layers from OCI image"
run = "bin/extract-kernelfs.sh"

[tasks.bake-rootfs]
description = "Bake a Firecracker rootfs ext4 image"
usage = '''
arg "<kernelfs-dir>" help="Path to kernelfs directory (e.g. kernelfs/6.18-fc-amd64)"
arg "<image-tag>" help="Docker image tag (e.g. alpine)"
'''
run = "bin/bake-rootfs.sh $usage_kernelfs_dir $usage_image_tag"

[tasks.cleanup]
description = "Remove all generated and runtime files (kernelfs, rootfs ext4, run)"
depends = ["cleanup:*"]

[tasks."cleanup:kernelfs"]
description = "Remove extracted kernel filesystem directories (kernelfs/*)"
run = "rm -rf kernelfs/*"

[tasks."cleanup:rootfs"]
description = "Remove baked rootfs ext4 images (rootfs/*/*.ext4)"
run = "rm -rf rootfs/*/*.ext4"

[tasks."cleanup:run"]
description = "Remove per-node runtime files (run/*)"
run = "rm -rf run/*"

[tasks.host-network]
depends = ["host-network:up"]

[tasks."host-network:up"]
description = "Setup host networking for Firecracker (bridge, tap, nftables, ufw)"
usage = '''
flag "--count <count>" help="Number of tap devices" default="1"
'''
run = "bin/setup-host-network.sh --count $usage_count up"

[tasks."host-network:down"]
description = "Tear down host networking for Firecracker"
usage = '''
flag "--count <count>" help="Number of tap devices" default="1"
'''
run = "bin/setup-host-network.sh --count $usage_count down"

[tasks."copy-ssh-keys"]
description = "Copy SSH public key to Firecracker nodes"
usage = '''
flag "--count <count>" help="Number of nodes" default="1"
'''
run = "bin/copy-ssh-keys.sh --count $usage_count"
