name: Build rootfs images

on:
  push:
    branches:
      - main
    paths:
      - rootfs/*/**
      - .github/workflows/build-rootfs.yml
  pull_request:
    paths:
      - rootfs/*/**
      - .github/workflows/build-rootfs.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set.outputs.images }}
    steps:
      - uses: actions/checkout@v6
      - id: set
        run: |
          dirs=$(ls -d rootfs/*/ 2>/dev/null | sed 's|rootfs/||;s|/||')
          echo "images=$(echo "$dirs" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.discover.outputs.images) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local dependencies
        run: |
          FROM_REFS=$(grep -oP '^FROM\s+\K\S+' "rootfs/${{ matrix.tag }}/Dockerfile" 2>/dev/null || true)
          PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:"
          for ref in $FROM_REFS; do
            case "$ref" in
              "$PREFIX"*)
                dep="${ref#$PREFIX}"
                if [ -f "rootfs/$dep/Dockerfile" ]; then
                  echo "Building local dependency: $dep -> $ref"
                  docker pull "$ref" 2>/dev/null || true
                  docker build -t "$ref" "rootfs/$dep"
                fi
                ;;
            esac
          done

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}

      - uses: docker/build-push-action@v7
        with:
          context: rootfs/${{ matrix.tag }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
